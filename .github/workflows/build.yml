name: Compila per Amiga

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    # USIAMO L'IMMAGINE UFFICIALE AMIGADEV
    # Nota il tag specifico: non è 'latest', ma 'm68k-amigaos'
    container: amigadev/crosstools:m68k-amigaos

    steps:
    - name: Scarica il codice
      uses: actions/checkout@v4

    - name: Compila il gioco
      # Il compilatore qui si chiama esattamente così
      run: m68k-amigaos-gcc main.c -o engine.exe -noixemul -Os -fomit-frame-pointer

    - name: Salva l'eseguibile
      uses: actions/upload-artifact@v4
      with:
        name: MioGiocoAmiga
        path: engine.exe
